name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Pushes that only touch tests/docker/** trigger the test-image
    # workflow, which republishes openwrt-test:latest. Letting Build
    # run on that same push races: it pulls the OLD :latest while the
    # new one is still baking. Skip — the next functional commit will
    # exercise the freshly published image.
    #
    # LIMITATION (mixed-push gap): paths-ignore skips a workflow only when
    # EVERY changed file matches. A single commit touching BOTH tests/docker/**
    # AND a functional file still runs Build, which pulls :latest while
    # test-image is mid-rebuild (its concurrency group can't yield —
    # cancel-in-progress: false). The pulled image is never corrupt (GHCR
    # repoints a tag only after all layers push — you get the OLD or NEW
    # complete image, not a torn one), so the worst case is the VM suite running
    # against the PRIOR-Dockerfile harness; the code under test is tar-pushed
    # into the guest at runtime, so the functional change is still exercised.
    # To test against the new harness in the same change, commit Dockerfile edits
    # separately, or re-run Build once test-image has published.
    paths-ignore:
      - 'tests/docker/**'
      - '.github/workflows/test-image.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level: every job is read-only by default. Only the
# publishing `build` job gets contents: write (job-level override below), so the
# PR-facing lint/test/browser-test jobs — including the privileged --device
# /dev/kvm test container running untrusted PR code — cannot write to the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Path-filtered CI via dorny/paths-filter: only the area(s) whose source paths
  # changed run. This now applies to BOTH pull_request AND push-to-main, so a
  # push that only touches (say) the UI skips the heavy backend VM `test` job —
  # the previous `|| github.event_name != 'pull_request'` escape forced every
  # domain to run on every push, re-testing code that hadn't changed. Tags and
  # workflow_dispatch still run everything (downstream gates fall through on
  # `startsWith(refs/tags/)` / workflow_dispatch), so the release path is never
  # accidentally skipped. Directory-based 3-domain model
  # (backend/ui/packaging) with a `shared` fan-out (test harness / CI infra
  # -> all three). These filters are the ONE source of truth for path gating: a
  # hand-written mirror of them used to live in tests/lib/domain_classify.sh, kept
  # in sync by eye, and it drifted — the ACL file was gated to `ui` while its
  # guards ran in `backend`, and the mirror's test happily passed. Deleted.
  changes:
    name: Detect changed domains
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.agg.outputs.backend }}
      ui: ${{ steps.agg.outputs.ui }}
      packaging: ${{ steps.agg.outputs.packaging }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Pinned to a full commit SHA (v3.0.3) per this repo's SHA-pin policy for
      # third-party actions. paths-filter resolves the diff base itself: PR base
      # on pull_request, github.event.before..after on a branch push. We run it on
      # BOTH so a push to main also skips unchanged domains' (heavy) test jobs —
      # tags and workflow_dispatch deliberately bypass the filter (run everything)
      # via the downstream gates, so we don't bother filtering there.
      # list-files: shell exposes steps.f.outputs.github_files for the
      # sing-box-extended carve-out below.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: f
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        with:
          list-files: shell
          filters: |
            backend:
              - 'singbox-ui/**'
              - 'plugins/awg_warp/lib/**'
              - 'plugins/awg_warp/root/**'
              - 'tests/backend/**'
              - 'tests/parity/**'
              - 'bbolt-client/**'
              # The ACL file lives in the UI package but the two guards that police
              # it (test_acl_coverage, test_rpcd_acl_sync) live in tests/backend, so
              # it must trigger the backend lane too. Otherwise a commit touching
              # ONLY the ACL — say, moving a mutating method into read.ubus — ran no
              # guard at all and shipped straight to the feed.
              - 'luci-app-singbox-ui/root/usr/share/rpcd/acl.d/**'
              - 'plugins/*/root/usr/share/rpcd/acl.d/**'
            ui:
              - 'luci-app-singbox-ui/**'
              - 'plugins/awg_warp/htdocs/**'
              - 'tests/ui/**'
              - 'tests/browser/**'
            packaging:
              - 'scripts/**'
              - 'install.sh'
              - 'feed/**'
              - 'tests/cross/**'
              # 16 of the 30 cross-tests guard backend/UI source, not packaging:
              # test_requires_pkg_allowlist (descriptors vs INSTALLABLE_PKGS),
              # test_rpcd_handler, test_capability_drop, test_main_js_syntax,
              # test_view_modules_layout, test_po_coverage, test_grid_columns,
              # test_route_tab_structure_js, test_json_import*. Without these
              # three globs a commit touching ONLY the backend or ONLY the UI ran
              # none of them — the same hole already fixed the other way round for
              # acl.d in the `backend` filter above.
              - 'singbox-ui/**'
              - 'luci-app-singbox-ui/**'
              - 'plugins/**'
            shared_core:
              - 'tests/lib/**'
              - 'tests/run*'
              - 'tests/docker/**'
              - 'tests/browser-container/**'
            github:
              - '.github/**'

      # Fold the cross-cutting `shared` domain into the four directory domains.
      # `shared` (test harness / CI infra) fans out to ALL four, EXCEPT a change
      # to ONLY .github/workflows/sing-box-extended.yml — a standalone workflow
      # with its own dispatch/schedule trigger, not part of the luci package
      # build/test, so it must fan out to nothing. We can't express that exclusion
      # as a paths-filter pattern (the default `some` quantifier makes a `!`-negated
      # glob a no-op), so we carve it out here from list-files output. On non-PR
      # events the paths-filter step is skipped (empty outputs) and these values
      # are ignored — every downstream job runs via its own event escape hatch.
      - name: Aggregate domains
        id: agg
        env:
          F_BACKEND:     ${{ steps.f.outputs.backend }}
          F_UI:          ${{ steps.f.outputs.ui }}
          F_PKG:         ${{ steps.f.outputs.packaging }}
          F_SHARED_CORE: ${{ steps.f.outputs.shared_core }}
          F_GITHUB:      ${{ steps.f.outputs.github }}
          GH_FILES:      ${{ steps.f.outputs.github_files }}
        run: |
          set -eu
          on() { [ "${1:-}" = "true" ]; }
          backend=false; ui=false; packaging=false

          # .github is shared UNLESS the only changed github file is the
          # standalone sing-box-extended workflow.
          gh_shared=false
          if on "$F_GITHUB"; then
            for x in $GH_FILES; do
              if [ "$x" != ".github/workflows/sing-box-extended.yml" ]; then
                gh_shared=true
                break
              fi
            done
          fi

          if on "$F_SHARED_CORE" || [ "$gh_shared" = true ]; then
            backend=true; ui=true; packaging=true
          else
            on "$F_BACKEND" && backend=true   || true
            on "$F_UI"      && ui=true        || true
            on "$F_PKG"     && packaging=true || true
          fi
          for k in backend ui packaging; do
            eval "v=\$$k"
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          echo "resolved: backend=$backend ui=$ui packaging=$packaging (gh_shared=$gh_shared)"

  lint:
    name: Lint (host)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      # Lint via the official shellcheck image instead of apt-installing the
      # binary on every run (saves the apt-get update/install round-trip and
      # pins a known shellcheck version). The repo is mounted at /mnt — the
      # image's WORKDIR — so .shellcheckrc at the root is honoured and the
      # relative globs resolve. Two invocations: the uci-defaults script must
      # be linted as busybox ash, not bash.
      - name: shellcheck
        # Pin to an explicit shellcheck version rather than the mutable :stable
        # tag — :stable is re-pointed upstream and pulled fresh each run, so the
        # lint behaviour (and the image we execute) could change without a commit.
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 \
            tests/*.sh tests/*/*.sh scripts/*.sh install.sh \
            singbox-ui/root/etc/init.d/singbox-ui
          # uci-defaults runs under busybox ash on OpenWrt, not bash. Lint the
          # WHOLE directory with --shell=ash so bashisms (arrays, [[ ]], $'...')
          # fail at CI rather than silently at first-boot on the router. Globbing
          # the dir (not a hardcoded file list) means a NEW uci-defaults script
          # is linted automatically and this lint-coverage can't drift again
          # (90-singbox-ui-fwmark was previously unlinted by anything).
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.10.0 --shell=ash \
            singbox-ui/root/etc/uci-defaults/* \
            plugins/awg_warp/root/usr/libexec/singbox-ui/awg-provision.sh

  typecheck:
    name: typecheck + biome
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.2.21'
      - run: cd tests && bun install --frozen-lockfile
      # Use the LOCKED-pinned tsc/biome from tests/node_modules — NOT `bunx
      # <tool>` which floats to the latest published version and made CI
      # non-deterministic (a new biome release silently broke the build).
      - run: cd tests && bun run typecheck
      # The browser harness (fixtures.ts) lives under tests/browser, which the
      # root tsconfig excludes; typecheck it under its own (DOM-lib) config so a
      # fixtures.ts regression is caught in CI, not only at the live browser run.
      # Needs tests/browser deps installed so tsc can resolve @playwright/test.
      - run: cd tests/browser && bun install --frozen-lockfile
      - run: cd tests && bun run typecheck:browser
      - run: cd tests && bun run lint

  js-unit:
    name: JS unit tests (host node)
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    # UI gate: run on UI/cross/lib changes, and always on push/main/tags.
    if: ${{ needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 12
    # All UI/JS tests now live in tests/ui/*.test.ts and run via `bun test
    # tests/ui`. ucode is absent on this host; json_import's ucode-half
    # gracefully SKIPs while its node-side assertions still execute.
    # PO coverage and main.js syntax are now covered by the tests/cross vitest lane.
    steps:
      - uses: actions/checkout@v6

      # Catch a forgotten `scripts/regen-po.sh` run: if a developer added a new
      # _('...') UI string without regenerating the template, the .pot here will
      # differ from the committed one. xgettext is needed for regen.
      - name: gettext (for regen-po)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: POT is up to date (regen-po produces no diff)
        run: |
          set -eu
          sh scripts/regen-po.sh
          # The template (.pot) must be byte-identical to what's committed.
          # regen-po pins POT-Creation-Date + sort order, so a clean tree diffs
          # empty. A non-empty diff means a forgotten regen — fail with the diff.
          if ! git diff --quiet -- luci-app-singbox-ui/po/templates/luci-singbox-ui.pot; then
            echo "FAIL: luci-singbox-ui.pot is stale — run scripts/regen-po.sh and commit."
            git --no-pager diff -- luci-app-singbox-ui/po/templates/luci-singbox-ui.pot
            exit 1
          fi
          echo "POT is up to date."

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.2.21'
      - run: cd tests && bun install --frozen-lockfile
      - run: cd tests && bun run test:ui

  test:
    name: Test suite (OpenWrt VM)
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    # Backend gate: run the VM suite on backend/cross/lib/scripts changes, and
    # always on push/main/tags.
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    # The QEMU-OpenWrt VM job is the one most likely to wedge (bad boot/loadvm).
    # Bound it so a hung guest fails fast instead of idling the runner ~6h.
    timeout-minutes: 25
    # The whole job runs inside the pre-built openwrt-test image. The
    # image carries qemu + the OpenWrt rootfs + a baked memory snapshot.
    # --device /dev/kvm passes the host's KVM into the container so qemu
    # can boot the guest via -loadvm in ~3-5 s. The image is published by
    # .github/workflows/test-image.yml; CI just pulls it. See
    # docs/superpowers/specs/2026-06-09-unified-qemu-test-rig-design.md.
    #
    # Owner is taken from ${{ github.repository_owner }} (lowercased by GHCR's
    # own normalisation) so this matches test-image.yml's published path after a
    # rename or on a fork — a hardcoded owner would 404 on pull. container.image
    # cannot reference a per-step output, but the repository_owner context is
    # allowed here.
    container:
      image: ghcr.io/${{ github.repository_owner }}/luci-singbox/openwrt-test:latest
      options: --device /dev/kvm

    steps:
      - uses: actions/checkout@v6

      - name: Run tests in OpenWrt VM
        env:
          WORK_DIR: ${{ github.workspace }}
        run: /opt/entrypoint.sh

  browser-test:
    name: Browser integration tests
    runs-on: ubuntu-24.04
    # browser-test consumes no artifact or output from the `test` (VM) job; they
    # run on separate runners with no shared state, so it only needs lint (+ the
    # changes filter). `build` below still gates on BOTH test and browser-test, so
    # correctness is unchanged while browser-test runs in parallel with the VM suite.
    needs: [lint, changes]
    # UI gate: run on UI/cross/lib changes, and always on push/main/tags.
    if: ${{ needs.changes.outputs.ui == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      # Third-party actions pinned to full commit SHAs (version in comment) —
      # they run with the repo checked out; a tag-repoint upstream must not be
      # able to change what executes here without a commit to this repo.
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          # Pin an exact version, not the '1.2.x' wildcard: setup-bun v2.0.2
          # passes the version verbatim into the bun.sh download URL, and
          # https://bun.sh/download/1.2.x/... now returns HTTP 400 (the literal
          # "x" is no longer accepted as a version segment). A concrete patch
          # (verified 200) keeps the job deterministic, matching the SHA-pin
          # philosophy above. Bump deliberately when a newer bun is wanted.
          bun-version: '1.2.21'

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      # Cache the Docker image's build layers across runs. test_browser.sh reads
      # BUILDX_CACHE and passes it to `docker buildx build --cache-from/--cache-to
      # type=local`, so this cache actually feeds the build (it used to save an
      # empty dir — nothing wrote to it). A fresh runner has an empty image store,
      # so the build always runs; the layer cache is what makes it fast (~few s on
      # a hit vs the full ~30s apk add on a miss).
      - name: Cache Docker buildx layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: browser-img-${{ hashFiles('tests/browser-container/**') }}
          restore-keys: browser-img-

      # Cache Playwright's browser download (chromium). Pinned to the
      # @playwright/test version in tests/browser/package.json. restore-keys
      # lets a version bump warm-start from the prior download.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/browser/package.json') }}
          restore-keys: playwright-

      - name: Install browser test deps
        working-directory: tests/browser
        run: |
          bun install --frozen-lockfile
          npx playwright install --with-deps chromium

      - name: Run browser suite
        env:
          # Point test_browser.sh's buildx layer cache at the same path the
          # actions/cache step above restores/saves, so the build feeds and
          # populates the cache.
          BUILDX_CACHE: /tmp/.buildx-cache
        run: bash tests/cross/test_browser.sh

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-diagnostics
          path: |
            /tmp/singbox-ui-browser-*.log
            /tmp/singbox-ui-browser-screenshots/
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Packaging/cross suite host-mode lane. The cross tests (feed index, i18n
  # .lmo, install.sh, manifest, ACL) need REAL apk-tools 3.0.5+: test_build_feed
  # builds fixtures with `apk mkpkg --info`, which the OpenWrt qemu VM's older
  # apk-tools lacks (it SKIPs there). So this domain runs on the host, NOT in the
  # VM (SB_DOMAIN=packaging is excluded from entrypoint.sh's VM domain set), and
  # acquires apk from the same OpenWrt SDK the `build` job uses — the SDK ships a
  # host `apk` (staging_dir/host/bin/apk) at apk-tools 3.0.5+ with `mkpkg --info`.
  # Exported as SINGBOX_APK_BIN, which the cross tests honour (falling back to
  # `command -v apk`). Gated on the packaging domain; never delegates to qemu.
  packaging:
    name: Packaging suite (host, apk-tools 3.0.5+)
    runs-on: ubuntu-24.04
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    timeout-minutes: 20
    env:
      # Single source of the SDK version within this job (mirrors the `build`
      # job): interpolated into both SDK_URL and the cache key so a bump can't
      # leave the key matching a stale extract.
      SDK_VERSION: 25.12.3
      SDK_URL: https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd wget

      # Cache the extracted SDK so the host apk is available without a cold
      # download every run. Shares no state with the `build` job's cache key
      # (different path), but the same SDK tarball — restore-keys warm-starts.
      - name: Cache OpenWrt SDK (host apk)
        uses: actions/cache@v5
        with:
          path: .pkg-sdk
          key: pkg-sdk-${{ env.SDK_VERSION }}-x86-64-v1
          restore-keys: |
            pkg-sdk-${{ env.SDK_VERSION }}-x86-64-

      # Extract the SDK's host `apk` (apk-tools 3.0.5+, has `mkpkg --info`) and
      # export its path. This is the SAME apk binary the `build` job uses via
      # scripts/build-apk.sh ($SDK_DIR/staging_dir/host/bin/apk).
      - name: Obtain apk-tools 3.0.5+ from the OpenWrt SDK
        run: |
          set -eu
          SDK_DIR="$PWD/.pkg-sdk"
          APK_BIN="$SDK_DIR/staging_dir/host/bin/apk"
          if [ ! -x "$APK_BIN" ]; then
            echo ">>> Downloading SDK: $SDK_URL"
            wget -q -O sdk.tar.zst "$SDK_URL"
            echo ">>> Extracting SDK"
            rm -rf "$SDK_DIR"
            mkdir -p "$SDK_DIR.tmp"
            tar --zstd -xf sdk.tar.zst -C "$SDK_DIR.tmp"
            root_dir="$(find "$SDK_DIR.tmp" -maxdepth 1 -mindepth 1 -type d | head -1)"
            mv "$root_dir" "$SDK_DIR"
            rm -rf "$SDK_DIR.tmp" sdk.tar.zst
          fi
          [ -x "$APK_BIN" ] || { echo "apk host tool missing at $APK_BIN" >&2; exit 1; }
          "$APK_BIN" mkpkg --help 2>&1 | grep -q -- '--info' \
            || { echo "SDK apk lacks 'mkpkg --info' (apk-tools too old)" >&2; exit 1; }
          echo "SINGBOX_APK_BIN=$APK_BIN" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.2.21'
      - run: cd tests && bun install --frozen-lockfile
      - run: cd tests && bun run test:cross

  build:
    name: Build OpenWrt packages (apk)
    # Pinned (not floating ubuntu-latest): this job installs apt build-deps and
    # runs the release-publishing path, so an unannounced runner-image bump must
    # not change build behaviour without a commit — same pinning philosophy as
    # the rest of the workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Gate the build (and its publish steps) on the full test suite. The publish
    # steps are event-gated to push/main and tags, so PR builds still validate
    # the package without publishing — but a red lint/js-unit/test/browser-test
    # run now BLOCKS the rolling `latest` release instead of shipping a broken
    # apk to install.sh consumers.
    needs: [lint, typecheck, js-unit, test, browser-test, changes]
    # On a path-filtered PR some heavy jobs may be SKIPPED (not their domain).
    # Run build whenever nothing FAILED: lint always runs; the domain-gated jobs
    # may be skipped, so accept anything that is not 'failure'. The four noarch
    # packages are assembled purely from the repo tree (no external binary
    # artifact to download), so there is no per-arch job the build must wait on.
    if: >-
      ${{ !cancelled()
          && needs.changes.result == 'success'
          && needs.lint.result == 'success'
          && needs.typecheck.result != 'failure'
          && needs.test.result != 'failure'
          && needs.js-unit.result != 'failure'
          && needs.browser-test.result != 'failure' }}
    # Only this job publishes releases, so it is the only one that needs write.
    # Top-level permissions are read-only (see header) — this override is the
    # single place contents: write is granted.
    permissions:
      contents: write

    env:
      # Pin to a tagged OpenWrt 25.x release. SDK_VERSION is the SINGLE source of
      # the version string within this job: it is interpolated into both SDK_URL
      # and the SDK cache key below, so bumping it can't leave the cache key
      # matching a stale extract. (build-apk.sh and the test-image Dockerfile
      # carry their own copies — see CLAUDE.md's multi-place bump note.)
      SDK_VERSION: 25.12.3
      SDK_URL: https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so `git rev-list --count HEAD` produces a
          # strictly-monotonic release number. Shallow clones report 1 on
          # every build, which collides with apk v3's world-hash check.
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zstd fakeroot build-essential wget python3

      # Cache both the downloaded tarball and the extracted SDK (with po2lmo
      # already built). On cache hit the script does no I/O work — straight to
      # assembling the package and calling apk mkpkg.
      - name: Cache OpenWrt SDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/luci-singbox-ui/openwrt-sdk
            .build/sdk
          # Fold build-apk.sh's hash into the key: the cache holds the EXTRACTED
          # SDK (po2lmo pre-built, feeds patched). When the script changes how it
          # prepares that SDK, a static key would silently reuse a stale extract.
          # restore-keys lets a script change still warm-start from the prior
          # extract (then the build refreshes it) instead of a cold download.
          # The version segment is interpolated from env.SDK_VERSION (single
          # source) so bumping SDK_URL/SDK_VERSION can't leave the key pinned to
          # a stale version's cache.
          key: openwrt-sdk-${{ env.SDK_VERSION }}-x86-64-v2-${{ hashFiles('scripts/build-apk.sh') }}
          restore-keys: |
            openwrt-sdk-${{ env.SDK_VERSION }}-x86-64-v2-
            openwrt-sdk-${{ env.SDK_VERSION }}-x86-64-

      # apk-mkpkg enforces Alpine-style versions: <X.Y.Z>[-rN]. For tag pushes
      # we use the tag (allowing an explicit -rN suffix); for rolling builds
      # the release number is the commit count so `apk upgrade` always sees a
      # strictly newer package.
      # Per-package versioning. A tag is a coordinated release: all five packages
      # share the tag version. A rolling main build versions EACH package as
      # 0.1.0-r<N>, where <N> = commits that touched THAT package's own paths — so
      # an unchanged package keeps its version+filename across pushes that don't
      # touch it (the feed then stops republishing it / it stops looking like a
      # new release every commit). `version` (the global 0.1.0-r<total>) is kept
      # only for the human-facing release title + workflow-artifact name.
      #
      # Why minor 0.1.x and not 0.0.x: every package already shipped 0.0.0-r<total>
      # (total commit count, ~r250). A per-package count is SMALLER, so reusing the
      # 0.0.0 base would be an apk DOWNGRADE on installed routers. Bumping the minor
      # to 1 makes 0.1.0-r<small> outrank any prior 0.0.0-r<big> (minor dominates),
      # so installs upgrade cleanly while per-package -r<N> drives churn from here.
      #
      # Path-sets are intentionally append-only / stable: each is `git rev-list
      # --count` over the package subtree + the packager (build-apk.sh). The
      # count() calls below still also name the deleted
      # scripts/install-manifest-*.txt pathspecs (build-apk.sh now lays down
      # the tree with a plain `cp -a`; there is no manifest anymore). That is
      # deliberate: they are kept as HISTORICAL pathspecs so the count can
      # only go forward. `git rev-list --count` on a nonexistent path returns
      # 0 harmlessly, whereas REMOVING the pathspec would make the count go
      # DOWN — i.e. backwards. We bias toward OVER-counting (a shared
      # packager change re-versions everything) because under-counting is the
      # dangerous direction — it would leave a CHANGED package on a stale
      # version so the feed never ships the update.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
            if [[ "$RAW" == *-r* ]]; then VERSION="$RAW"; else VERSION="${RAW}-r1"; fi
            # Coordinated release: every package gets the tag version.
            emit version    "$VERSION"
            emit v_singbox   "$VERSION"
            emit v_luciapp   "$VERSION"
            emit v_i18n      "$VERSION"
            emit v_awgwarp   "$VERSION"
          else
            BASE="0.1.0"
            PKGR="scripts/build-apk.sh"
            count() { git rev-list --count HEAD -- "$@"; }
            emit version  "${BASE}-r$(git rev-list --count HEAD)"
            emit v_singbox "${BASE}-r$(count singbox-ui/ scripts/install-manifest-singbox-ui.txt "$PKGR")"
            emit v_luciapp "${BASE}-r$(count luci-app-singbox-ui/ scripts/install-manifest-luci-app-singbox-ui.txt "$PKGR")"
            emit v_i18n    "${BASE}-r$(count luci-app-singbox-ui/po/ "$PKGR")"
            emit v_awgwarp "${BASE}-r$(count plugins/awg_warp/ "$PKGR")"
          fi

      - name: Build apk packages
        # sudo -E so the SDK cache (SDK_CACHE_DIR via $HOME) and ~/.cache
        # paths line up with the cache action above. Required: Ubuntu 24.04
        # disables unprivileged user namespaces by default, so the
        # `unshare -r` branch can't run as the runner user — and the
        # fakeroot fallback was removed because the SDK's `apk` wrapper
        # hijacks LD_PRELOAD and silently produced nobody:nogroup packages
        # (see scripts/build-apk.sh comments). Real root is the reliable
        # path.
        # PKG_VER_* drive per-package versions (see Derive version). The positional
        # version is the fallback for any unset override; we set all four, so it is
        # only a belt-and-suspenders default.
        run: |
          sudo -E env \
            PKG_VER_SINGBOX="${{ steps.version.outputs.v_singbox }}" \
            PKG_VER_LUCIAPP="${{ steps.version.outputs.v_luciapp }}" \
            PKG_VER_I18N="${{ steps.version.outputs.v_i18n }}" \
            PKG_VER_AWGWARP="${{ steps.version.outputs.v_awgwarp }}" \
            bash scripts/build-apk.sh "${{ steps.version.outputs.version }}" "$PWD/dist"

      # build-apk.sh ran under sudo, so the SDK tarball + extracted SDK are
      # root-owned. The actions/cache POST-step saves them as the unprivileged
      # runner user; it works today only because tar leaves world-readable perms.
      # Chown the cache tree back so the save is unambiguous insurance against a
      # silent cache-save failure (which would force a cold SDK download forever).
      - name: Reclaim ownership of SDK cache for save
        if: always()
        run: |
          set -eu
          sudo chown -R "$(id -u):$(id -g)" .build/sdk "$HOME/.cache/luci-singbox-ui" 2>/dev/null || true

      - name: List produced packages
        id: pkg
        run: |
          set -euo pipefail
          ls -la dist/
          {
            echo 'files<<EOF'
            ls -1 dist/*.apk
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: luci-singbox-ui-${{ steps.version.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Push to main → rolling pre-release `latest` (recreated each push so the
      # asset always reflects the tip of main). Stage fixed-named (version-less)
      # copies so --clobber can overwrite the SAME asset names each push and the
      # `latest` release never accumulates version-suffixed garbage.
      - name: Stage fixed-named assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Each package now carries its OWN version in its built filename
          # (per-package versioning), so reference each one's version explicitly.
          V_SINGBOX="${{ steps.version.outputs.v_singbox }}"
          V_LUCIAPP="${{ steps.version.outputs.v_luciapp }}"
          V_I18N="${{ steps.version.outputs.v_i18n }}"
          V_AWGWARP="${{ steps.version.outputs.v_awgwarp }}"
          # dist/ is root-owned (build-apk.sh runs under sudo).
          # All four packages are noarch -> fixed, version-less asset names.
          sudo cp "dist/singbox-ui_${V_SINGBOX}.apk"               dist/singbox-ui.apk
          sudo cp "dist/luci-app-singbox-ui_${V_LUCIAPP}.apk"      dist/luci-app-singbox-ui.apk
          sudo cp "dist/luci-i18n-singbox-ui-ru_${V_I18N}.apk"     dist/luci-i18n-singbox-ui-ru.apk
          sudo cp "dist/singbox-ui-plugin-awg_warp_${V_AWGWARP}.apk" dist/singbox-ui-plugin-awg_warp.apk
          sudo chown "$(id -u):$(id -g)" \
            dist/singbox-ui.apk \
            dist/luci-app-singbox-ui.apk dist/luci-i18n-singbox-ui-ru.apk \
            dist/singbox-ui-plugin-awg_warp.apk
          # Per-package version manifest. The Pages workflow (a separate workflow
          # that can't see this job's step outputs) compares this against the copy
          # stored in gh-pages to decide whether the feed needs redeploying — with
          # per-package versions a single global version no longer answers "did any
          # package change", so we publish the whole set. Deterministic (versions
          # only move when content moves), unlike an apk byte-hash (mkpkg embeds
          # timestamps), so it is a stable skip/deploy signal.
          {
            echo "singbox-ui ${V_SINGBOX}"
            echo "luci-app-singbox-ui ${V_LUCIAPP}"
            echo "luci-i18n-singbox-ui-ru ${V_I18N}"
            echo "singbox-ui-plugin-awg_warp ${V_AWGWARP}"
          } | sudo tee dist/versions.txt
          sudo chown "$(id -u):$(id -g)" dist/versions.txt
          ls -1 dist/*.apk

      # Checksums for every published apk. Consumed by the Pages workflow, which
      # downloads the rolling-release assets and runs `sha256sum -c sha256sums.txt`
      # before assembling the signed apk feed (install.sh itself is feed-based now
      # and verifies via the signed index, not this file). Runs AFTER the stable-
      # named assets are staged so the names match what the release serves. Names
      # are basename-only (no dist/ prefix). dist/ is root-owned.
      - name: Generate sha256sums.txt
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          cd dist
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            sha256sum singbox-ui.apk luci-app-singbox-ui.apk luci-i18n-singbox-ui-ru.apk singbox-ui-plugin-awg_warp.apk | sudo tee sha256sums.txt
          else
            sha256sum singbox-ui_*.apk luci-app-singbox-ui_*.apk luci-i18n-singbox-ui-ru_*.apk singbox-ui-plugin-awg_warp_*.apk | sudo tee sha256sums.txt
          fi
          sudo chown "$(id -u):$(id -g)" sha256sums.txt
          cat sha256sums.txt

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Same action the tagged-release step below uses. It creates the release on
        # first run and updates it in place afterwards, retargeting the tag to the
        # current SHA and overwriting the assets — which is exactly what the ~25
        # lines of hand-rolled `gh release view/create/edit/upload --clobber` did.
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build (${{ steps.version.outputs.version }})
          body: >-
            Auto-built from `main` @ `${{ github.sha }}` — dev version
            `${{ steps.version.outputs.version }}`. Replaced on every push to main.
            Package set (all noarch): `singbox-ui.apk` (backend, includes the
            pure-ucode bbolt cache.db reader), `luci-app-singbox-ui.apk` (LuCI UI),
            `luci-i18n-singbox-ui-ru.apk` (RU translation),
            `singbox-ui-plugin-awg_warp.apk` (AWG/WARP plugin). These feed the signed
            apk feed (GitHub Pages); end users install via that feed — see install.sh
            / the Pages landing. `sha256sums.txt` covers every published asset.
          prerelease: true
          files: |
            dist/singbox-ui.apk
            dist/luci-app-singbox-ui.apk
            dist/luci-i18n-singbox-ui-ru.apk
            dist/singbox-ui-plugin-awg_warp.apk
            dist/sha256sums.txt
            dist/versions.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag push (v*) → permanent, non-prerelease GitHub Release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        # Pinned to a full commit SHA (v2.4.1) rather than the mutable @v2 tag:
        # this action runs with contents: write and the release-publishing token,
        # and its assets are consumed by an unattended `wget | sh` installer.
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          files: |
            dist/*.apk
            dist/sha256sums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
